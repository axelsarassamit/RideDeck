name: Signed Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore private signing key
        env:
          GX12_KEYSTORE_BASE64: ${{ secrets.GX12_KEYSTORE_BASE64 }}
        run: |
          test -n "$GX12_KEYSTORE_BASE64" || { echo "Missing GX12_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p signing
          printf '%s' "$GX12_KEYSTORE_BASE64" | base64 --decode > signing/release-key.jks

      - name: Build signed APK
        env:
          GX12_KEYSTORE_PATH: signing/release-key.jks
          GX12_KEYSTORE_PASSWORD: ${{ secrets.GX12_KEYSTORE_PASSWORD }}
          GX12_KEY_ALIAS: ${{ secrets.GX12_KEY_ALIAS }}
          GX12_KEY_PASSWORD: ${{ secrets.GX12_KEY_PASSWORD }}
          GX12_VERSION_NAME: ${{ github.ref_name }}
        run: |
          test -n "$GX12_KEYSTORE_PASSWORD" || { echo "Missing GX12_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$GX12_KEY_ALIAS" || { echo "Missing GX12_KEY_ALIAS repository secret"; exit 1; }
          test -n "$GX12_KEY_PASSWORD" || { echo "Missing GX12_KEY_PASSWORD repository secret"; exit 1; }
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/gx12-companion-release.apk
          cd release-assets
          sha256sum gx12-companion-release.apk > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/gx12-companion-release.apk \
            release-assets/checksums.txt \
            --title "RideBridge $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
